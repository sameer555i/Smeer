<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button id="menuBtn" class="hamburger-btn" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="brand js-store-name">Store</div>
    </div>
    <a href="index.html" class="btn btn-sm">Catalog</a>
  </header>

  <div id="drawerBackdrop" class="drawer-backdrop"></div>
  <nav id="sideDrawer" class="side-drawer">
    <div class="drawer-title js-store-name">Menu</div>
    <a href="index.html" class="nav-link">Catalog</a>
    <a href="about.html" class="nav-link">About Us</a>
    <a href="contact.html" class="nav-link active">Contact Us</a>
  </nav>

  <main class="container">
    <section class="glass-box">
      <h1 style="font-size: 1.35rem; margin-bottom: 14px;">Contact Us</h1>
      <p id="contactContent" style="color: var(--text-muted); line-height: 1.7; white-space: pre-line; margin-bottom: 18px;">Loading...</p>

      <div id="contactActions" style="display: flex; gap: 12px; flex-wrap: wrap;"></div>
    </section>
  </main>

  <div id="toast" class="status-toast"></div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const data = await StoreAPI.fetchAll(false);
        if (data.status === "success") {
          const s = data.settings || {};
          document.title = `Contact Us - ${s.store_name || "Store"}`;
          setupNavigation(s.store_name);
          document.getElementById("contactContent").textContent = s.contact_us || "संपर्क विवरण जल्द ही अपडेट होगा।";

          const actions = document.getElementById("contactActions");
          const waNum = String(s.whatsapp_number || "").replace(/\D/g, "");
          if (waNum) {
            actions.innerHTML += `<a href="https://wa.me/${waNum}" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp">Chat on WhatsApp</a>`;
          }
          if (s.contact_email) {
            actions.innerHTML += `<a href="mailto:${escapeHtml(s.contact_email)}" class="btn btn-primary">Email Us</a>`;
          }
        }
      } catch (e) {
        document.getElementById("contactContent").textContent = "जानकारी लोड नहीं हो सकी।";
      }
    });
  </script>
</body>
</html>
