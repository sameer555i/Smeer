<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K-TECH</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button id="menuBtn" class="hamburger-btn" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div id="brandTrigger" class="brand-wrap" title="Tap 5 times for admin">
        <img id="topLogoImg" class="brand-logo-img" alt="Logo" />
        <div id="brandTitle" class="brand js-store-name">K-TECH</div>
      </div>
    </div>
    <div class="topbar-right">
      <button id="themeToggleBtn" class="btn btn-sm btn-white" onclick="toggleThemeMode()">Light</button>
      <button id="exitAdminBtn" class="btn btn-sm btn-white" style="display: none;" onclick="logoutAdmin()">Exit Admin</button>
    </div>
  </header>

  <div id="drawerBackdrop" class="drawer-backdrop"></div>
  <nav id="sideDrawer" class="side-drawer">
    <div class="drawer-title js-store-name">Menu</div>
    <a href="index.html" class="nav-link active">Catalog</a>
    <div class="drawer-section-label">Categories</div>
    <div id="drawerCategoryList" class="drawer-cat-list"></div>
    <a href="about.html" class="nav-link">About Us</a>
    <a href="contact.html" class="nav-link">Contact Us</a>
  </nav>

  <main class="container">
    <section id="adminPanel" class="glass-box" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h2 style="font-size: 1.1rem;">Admin Dashboard</h2>
      </div>

      <div class="admin-tabs">
        <button class="tab-btn active" data-tab="tabProducts" onclick="switchAdminTab('tabProducts', this)">Products</button>
        <button class="tab-btn" data-tab="tabCategories" onclick="switchAdminTab('tabCategories', this)">Categories</button>
        <button class="tab-btn" data-tab="tabCustomize" onclick="switchAdminTab('tabCustomize', this)">Customize</button>
        <button class="tab-btn" data-tab="tabSettings" onclick="switchAdminTab('tabSettings', this)">Settings</button>
        <button class="tab-btn" data-tab="tabPassword" onclick="switchAdminTab('tabPassword', this)">Password</button>
      </div>

      <div id="tabProducts" class="admin-section active">
        <h3 id="prodFormHeading" style="font-size: 1rem; margin-bottom: 12px;">Add New Product</h3>
        <input id="editProdId" type="hidden" />

        <div class="form-group">
          <label for="prodTitle">Product Title</label>
          <input id="prodTitle" type="text" placeholder="Enter product title" />
        </div>

        <div class="form-group">
          <label for="prodCategory">Category</label>
          <select id="prodCategory">
            <option value="General">General</option>
          </select>
        </div>

        <div class="form-group">
          <label for="prodMrp">MRP</label>
          <input id="prodMrp" type="text" placeholder="e.g. 1499 or ₹1499" />
        </div>

        <div class="form-group">
          <label for="prodPrice">Price (Selling Price)</label>
          <input id="prodPrice" type="text" placeholder="e.g. 999 or ₹999" />
        </div>

        <div class="custom-grid-2 form-group">
          <div>
            <label for="prodStockStatus">Stock Availability</label>
            <select id="prodStockStatus">
              <option value="in_stock">In Stock</option>
              <option value="out_of_stock">Out of Stock</option>
            </select>
          </div>
          <div>
            <label for="prodStockQty">Stock Quantity</label>
            <input id="prodStockQty" type="number" min="0" value="10" placeholder="Quantity" />
          </div>
        </div>

        <div class="form-group">
          <label for="prodDesc">Description</label>
          <textarea id="prodDesc" placeholder="Write full product description..."></textarea>
        </div>

        <div class="form-group">
          <label for="prodImages">Photos (Up to 4 photos, duplicate blocked)</label>
          <input id="prodImages" type="file" accept="image/*" multiple onchange="handleImagePreview(event)" />
          <div id="previewStrip" class="preview-strip"></div>
        </div>

        <div class="form-group">
          <label>Suggested Products</label>
          <div id="suggestedList" class="suggestion-checklist"></div>
        </div>

        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <button id="saveProdBtn" class="btn btn-white" onclick="saveProduct()">Save Product</button>
          <button id="cancelEditBtn" class="btn" style="display: none;" onclick="resetProductForm()">Cancel Edit</button>
        </div>
        <p style="font-size: 0.78rem; color: var(--text-muted); margin-top: 10px;">Tip: Long-press any product card below to Edit or Delete.</p>
      </div>

      <div id="tabCategories" class="admin-section">
        <div class="form-group">
          <label for="newCategoryInput">New Category Name</label>
          <div style="display: flex; gap: 10px;">
            <input id="newCategoryInput" type="text" placeholder="e.g. Mixer Grinders, Irons" />
            <button class="btn btn-white" onclick="addCategory()">Add</button>
          </div>
        </div>
        <div id="categoryChips" class="chip-list"></div>
      </div>

      <div id="tabCustomize" class="admin-section">
        <div class="form-group">
          <label for="logoFileInput">Top Bar Company Logo</label>
          <input id="logoFileInput" type="file" accept="image/*" onchange="handleLogoUpload(event)" />
          <div id="logoPreviewBox" class="preview-strip"></div>
        </div>

        <div class="form-group">
          <label for="bannerFilesInput">Auto-Changing Hero Banner Photos (Up to 5 photos)</label>
          <input id="bannerFilesInput" type="file" accept="image/*" multiple onchange="handleBannerUpload(event)" />
          <div id="bannerPreviewBox" class="preview-strip"></div>
        </div>

        <div class="custom-grid-2 form-group">
          <div>
            <label for="custBannerSpeed">Banner Slide Speed (sec)</label>
            <input id="custBannerSpeed" type="number" min="2" max="15" value="3" />
          </div>
          <div>
            <label for="custBannerAnim">Banner Animation Style</label>
            <select id="custBannerAnim">
              <option value="smooth-slide">Smooth Slide</option>
              <option value="soft-glide">Soft Glide</option>
              <option value="gentle-fade">Gentle Fade</option>
            </select>
          </div>
        </div>

        <div class="custom-grid-2 form-group">
          <div>
            <label for="custCardRadius">Card Corner Radius (px)</label>
            <input id="custCardRadius" type="number" min="4" max="28" value="16" />
          </div>
          <div>
            <label for="custThemeMode">Default Theme Mode</label>
            <select id="custThemeMode">
              <option value="dark">Dark Theme</option>
              <option value="light">Light Theme</option>
            </select>
          </div>
        </div>

        <div class="custom-grid-2 form-group">
          <div>
            <label for="custShowBanner">Show Auto Banner</label>
            <select id="custShowBanner">
              <option value="true">Enabled</option>
              <option value="false">Hidden</option>
            </select>
          </div>
          <div>
            <label for="custShowStock">Show Stock & Qty on Cards</label>
            <select id="custShowStock">
              <option value="true">Visible</option>
              <option value="false">Hidden</option>
            </select>
          </div>
        </div>

        <div class="custom-grid-2 form-group">
          <div>
            <label for="custCompactCards">Compact Card Mode</label>
            <select id="custCompactCards">
              <option value="false">Standard</option>
              <option value="true">Compact</option>
            </select>
          </div>
          <div>
            <label for="custShowDate">Show Date on Cards</label>
            <select id="custShowDate">
              <option value="true">Visible</option>
              <option value="false">Hidden</option>
            </select>
          </div>
        </div>

        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <button id="saveCustomizeBtn" class="btn btn-white" onclick="saveCustomization()">Save Customization</button>
          <button class="btn" onclick="resetCustomization()">Reset Defaults</button>
        </div>
      </div>

      <div id="tabSettings" class="admin-section">
        <div class="form-group">
          <label for="setStoreName">Store Name</label>
          <input id="setStoreName" type="text" />
        </div>
        <div class="form-group">
          <label for="setWhatsapp">WhatsApp Number</label>
          <input id="setWhatsapp" type="text" />
        </div>
        <div class="form-group">
          <label for="setEmail">Contact Email</label>
          <input id="setEmail" type="email" />
        </div>
        <div class="form-group">
          <label for="setAbout">About Us Content</label>
          <textarea id="setAbout"></textarea>
        </div>
        <div class="form-group">
          <label for="setContact">Contact Us Content</label>
          <textarea id="setContact"></textarea>
        </div>
        <button id="saveSettingsBtn" class="btn btn-white" onclick="saveSiteSettings()">Save Settings</button>
      </div>

      <div id="tabPassword" class="admin-section">
        <div class="form-group">
          <label for="oldPassInput">Current Password</label>
          <div class="pass-wrap">
            <input id="oldPassInput" type="password" placeholder="Enter current password" />
            <button type="button" class="pass-toggle-btn" onclick="togglePassVisibility('oldPassInput', this)">Show</button>
          </div>
        </div>
        <div class="form-group">
          <label for="newPassInput">New Password</label>
          <div class="pass-wrap">
            <input id="newPassInput" type="password" placeholder="Enter new password" />
            <button type="button" class="pass-toggle-btn" onclick="togglePassVisibility('newPassInput', this)">Show</button>
          </div>
        </div>
        <button id="changePassBtn" class="btn btn-white" onclick="changeAdminPassword()">Update Password</button>
      </div>
    </section>

    <div id="heroBannerWrap" class="hero-banner-wrap">
      <div id="heroBannerTrack" class="hero-banner-track"></div>
      <div id="heroDots" class="hero-dots"></div>
    </div>

    <div id="categoryBar" class="category-bar"></div>
    <div id="productsGrid" class="grid"></div>
  </main>

  <div id="authModal" class="modal-backdrop">
    <div class="modal-box">
      <h3 style="margin-bottom: 12px;">Admin Login</h3>
      <div class="form-group">
        <label for="adminPassInput">Password</label>
        <div class="pass-wrap">
          <input id="adminPassInput" type="password" placeholder="Enter password" />
          <button type="button" class="pass-toggle-btn" onclick="togglePassVisibility('adminPassInput', this)">Show</button>
        </div>
      </div>
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button class="btn" onclick="closeAuthModal()">Cancel</button>
        <button id="unlockBtn" class="btn btn-white" onclick="verifyAdminLogin()">Unlock</button>
      </div>
    </div>
  </div>

  <div id="longPressModal" class="modal-backdrop" onclick="if(event.target===this)closeLongPressModal()">
    <div class="modal-box">
      <h3 id="lpProductTitle" style="margin-bottom: 14px; font-size: 1rem;">Manage Product</h3>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button id="lpEditBtn" class="btn btn-white">Edit Product</button>
        <button id="lpDeleteBtn" class="btn btn-danger">Delete Product</button>
        <button class="btn" onclick="closeLongPressModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast" class="status-toast">
    <span id="toastText"></span>
    <button id="toastUndoBtn" class="btn btn-sm btn-white" style="display: none;" onclick="undoLastDelete()">Undo</button>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
