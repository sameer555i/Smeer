name: Build K-TECH APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'logo.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK 34 & Build Tools
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Generate Android App Source & K-TECH Logo
        run: |
          mkdir -p android-app/app/src/main/java/com/ktech/store
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android-app/gradle/wrapper

          if [ -f "logo.png" ]; then
            cp "logo.png" android-app/app/src/main/res/drawable/ic_launcher.png
            for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp "logo.png" "android-app/app/src/main/res/$d/ic_launcher.png"
            done
          else
            cat << 'EOF' > android-app/app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0B132B"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#F97316"
                  android:pathData="M22,22 L86,22 Q92,22 92,28 L92,80 Q92,86 86,86 L22,86 Q16,86 16,80 L16,28 Q16,22 22,22 Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M34,34 L42,34 L42,50 L58,34 L68,34 L50,52 L69,74 L59,74 L42,55 L42,74 L34,74 Z"/>
          </vector>
          EOF
          fi

          cat << 'EOF' > android-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "K-TECH"
          include ':app'
          EOF

          cat << 'EOF' > android-app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > android-app/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.ktech.store'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ktech.store"
                  minSdk 23
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="K-TECH"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-app/app/src/main/java/com/ktech/store/MainActivity.java
          package com.ktech.store;

          import android.content.Context;
          import android.content.Intent;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final String STORE_URL = "https://sameer555i.github.io/Smeer/index.html";

              private final ActivityResultLauncher<Intent> fileChooserLauncher =
                  registerForActivityResult(new ActivityResultContracts.StartActivityForResult(), result -> {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (result.getResultCode() == RESULT_OK && result.getData() != null) {
                          if (result.getData().getClipData() != null) {
                              int count = result.getData().getClipData().getItemCount();
                              results = new Uri[count];
                              for (int i = 0; i < count; i++) {
                                  results[i] = result.getData().getClipData().getItemAt(i).getUri();
                              }
                          } else if (result.getData().getData() != null) {
                              results = new Uri[]{result.getData().getData()};
                          }
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  });

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setCacheMode(isNetworkAvailable()
                      ? WebSettings.LOAD_DEFAULT
                      : WebSettings.LOAD_CACHE_ELSE_NETWORK);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("https://wa.me/") || url.startsWith("whatsapp:") || url.startsWith("mailto:") || url.startsWith("tel:")) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = callback;
                          Intent intent = params.createIntent();
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          fileChooserLauncher.launch(intent);
                          return true;
                      }
                  });

                  webView.loadUrl(STORE_URL);
              }

              private boolean isNetworkAvailable() {
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  NetworkInfo info = cm != null ? cm.getActiveNetworkInfo() : null;
                  return info != null && info.isConnected();
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Initialize Gradle Wrapper & Build Debug APK
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload K-TECH APK
        uses: actions/upload-artifact@v4
        with:
          name: K-TECH-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
